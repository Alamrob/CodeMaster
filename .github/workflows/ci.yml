name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  required-ci:
    name: Required CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python 3.12 quality runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package with quality extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,images,pixels]"
      - name: Ruff format check
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Run the full suite once
        run: pytest
      - name: Python 3.12 CLI smoke test
        run: codemaster identify --json src | python -c "import json,sys; data=json.load(sys.stdin); print(f'identified {len(data)} files')"
      - name: Set up Python 3.11 compatibility runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python 3.11 compatibility surface
        run: python -m pip install -e ".[images,pixels]"
      - name: Python 3.11 CLI compatibility smoke test
        run: codemaster identify --json src | python -c "import json,sys; data=json.load(sys.stdin); print(f'identified {len(data)} files')"
