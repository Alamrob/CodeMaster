[local]
hooks = true

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: ruff format --check .
        language: system
        pass_filenames: false
      - id: ruff
        name: ruff lint
        entry: ruff check .
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy strict
        entry: mypy
        language: system
        pass_filenames: false
      - id: codemaster-smoke
        name: codemaster smoke
        entry: codemaster identify --json src > /dev/null
        language: system
        pass_filenames: false
