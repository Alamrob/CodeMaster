# CodeMaster — catalogo de huellas de IA
# Anade o quita entradas sin tocar codigo. Cada modelo es una fila [[models]];
# las frases por categoria en [phrases]; el mapeo de agentes C2PA en [agents].

[meta]
version = "1"

[groups]
llm = "Modelos de lenguaje / chat"
image = "Generacion de imagenes"
video = "Generacion de video"
audio = "Generacion de audio / voz / musica"
code = "Generacion de codigo"

[phrases]
authorship = [
  "\\b(?:generated|created|written|authored|produced|built)\\s+by\\s+(?:claude|chatgpt|gpt-?\\d?|openai|github\\s+copilot|gemini|bard|llama|mistral|codex)",
  "\\b(?:made|developed)\\s+with\\s+(?:claude|chatgpt|openai|github\\s+copilot|gemini|bard)",
  "\\bas\\s+an\\s+ai\\s+(?:assistant|language\\s+model|model)\\b",
  "\\bai\\s+(?:assistant|model)\\s+generated\\b",
]
narration = [
  "\\bnote\\s+that\\b",
  "\\bplease\\s+note\\b",
  "\\bkeep\\s+in\\s+mind\\b",
  "\\bin\\s+conclusion\\b",
  "\\bhope\\s+this\\s+helps\\b",
  "\\bfeel\\s+free\\s+to\\b",
  "\\blet'?s\\s+dive\\b",
  "\\bhere'?s\\s+how\\b",
  "\\bas\\s+you\\s+can\\s+see\\b",
  "\\bremember\\s+to\\b",
  "\\bdon'?t\\s+forget\\s+to\\b",
  "\\bof\\s+course\\b",
  "\\bimportantly\\b",
  "\\bas\\s+always\\b",
  "\\bhappy\\s+to\\s+help\\b",
  "\\bany\\s+questions\\b",
  "\\bfor\\s+your\\s+convenience\\b",
  "\\bmoreover\\b",
  "\\bfurthermore\\b",
  "\\bnonetheless\\b",
  "\\bmeanwhile\\b",
  "\\bin\\s+summary\\b",
  "\\bin\\s+essence\\b",
]
fragment = [
  "\\brest\\s+of\\s+the\\s+code\\b",
  "\\bremaining\\s+logic\\b",
  "\\bremainder\\s+of\\s+the\\b",
  "\\btruncated\\s+for\\s+brevity\\b",
  "\\byour\\s+code\\s+here\\b",
  "\\bsome\\s+code\\s+here\\b",
  "\\blorem\\s+ipsum\\b",
  "\\bunchanged\\s+code\\b",
  "\\bfull\\s+implementation\\s+omitted\\b",
]

[[models]]
name = "chatgpt"
group = "llm"
patterns = ["chatgpt"]
[[models]]
name = "gpt-4o"
group = "llm"
patterns = ["gpt-4o"]
[[models]]
name = "gpt-4"
