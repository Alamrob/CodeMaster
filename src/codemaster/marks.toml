# CodeMaster — catalogo de marcas visibles (plugins)
# Registrar una marca = anadir un archivo alpha en src/codemaster/assets/
# + una entrada [[marks]] aqui. El motor visible.py no se toca.

[meta]
version = "1"

[[marks]]
key = "doubao"
label = "Doubao 豆包AI生成 text"
asset = "doubao_alpha.png"
corner = "br"
margin_floor = 4
width_frac = 0.22
height_frac = 0.075
margin_x_frac = 0.004
margin_bottom_frac = 0.004
max_saturation = 55
logo_min_luma = 150
tophat_delta = 12
morph_open_size = 5
detect_ncc_threshold = 0.50
detect_frontend = "tophat"
scale_basis = "short"
ladder = [0.8, 1.0, 1.25]
alpha_width_frac = 0.1636
alpha_height_frac = 0.0405
min_gw = 8

