name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  required-ci:
    name: Required CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.12 quality runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package with quality extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,images,pixels]"
      - name: Ruff format check
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Run the full suite once
        run: pytest
      - name: Python 3.12 CLI smoke test
        run: codemaster identify --json src | python -c "import json,sys; data=json.load(sys.stdin); print(f'identified {len(data)} files')"
      - name: Set up Python 3.11 compatibility runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python 3.11 compatibility surface
        run: python -m pip install -e ".[images,pixels]"
      - name: Python 3.11 CLI compatibility smoke test
        run: codemaster identify --json src | python -c "import json,sys; data=json.load(sys.stdin); print(f'identified {len(data)} files')"
