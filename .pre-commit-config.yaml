[local]
hooks = true

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: ruff format --check .
        language: system
        pass_filenames: false
      - id: ruff
        name: ruff lint
        entry: ruff check .
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy strict
        entry: mypy
        language: system
        pass_filenames: false
      - id: codemaster-check
        name: codemaster check
        entry: codemaster check --strict . --exclude tests --exclude signatures.py --exclude registry.py --exclude visible.py --exclude assets --exclude remove-ai-watermarks-main
        language: system
        pass_filenames: false
